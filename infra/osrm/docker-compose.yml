## OSRM Backend — road-snapping and route matching
## Uses MLD algorithm for fast map matching on Nordeste (Brazil) road data.
## Data source: https://download.geofabrik.de/south-america/brazil/nordeste-latest.osm.pbf
## See .env.example for setup and data preparation steps.

services:
  osrm:
    image: osrm/osrm-backend:latest
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld /data/nordeste-latest.osrm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/match/v1/driving/-38.5,-12.97;-38.51,-12.97?timestamps=1000;1010 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 4g
    restart: unless-stopped
